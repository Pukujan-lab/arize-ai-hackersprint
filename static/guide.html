<style>*{box-sizing:border-box}body{margin:0;background:#0a0a0b;color:#ededed;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:17px;line-height:1.55}
a{color:inherit;text-decoration:none}.nav{position:sticky;top:0;z-index:5;display:flex;gap:28px;align-items:center;height:56px;padding:0 40px;border-bottom:1px solid #1f1f22;background:rgba(10,10,11,.9)}.nav a{color:#8f8f95;font-size:14px}.nav a.on,.nav a:hover{color:#fff}

.n{font-size:56px;font-weight:800;color:#6366f1;line-height:1}.t{font-size:26px;font-weight:700}.tm{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;color:#a1a1aa;cursor:pointer;border:1px solid #2a2a2e;border-radius:12px;padding:6px 14px;min-width:96px;text-align:center}
.tm.run{color:#22d3a6;border-color:#22d3a6}.tm.over{color:#f87171;border-color:#f87171}
.btn{display:inline-flex;height:34px;align-items:center;padding:0 14px;border-radius:999px;border:1px solid #2a2a2e;font-size:13px;margin-left:auto}.btn:hover{border-color:#666}
.p{display:flex;align-items:center;gap:16px;padding:10px 0;border-top:1px solid #1f1f22}label{display:block;padding:6px 0}input[type=checkbox]{width:18px;height:18px;margin-right:10px;accent-color:#6366f1;vertical-align:-3px}</style></head><body>

<div class="wrap"><div class="s" style="text-transform:uppercase;letter-spacing:.08em">Presenter guide · 3 min 20 s · click a timer to start it</div><h1>Precedent: a reliable pipeline for multi-agent AI</h1>
<div style="background:#111113;border:1px solid #1f1f22;border-radius:16px;padding:24px;margin-top:24px"><div class="s" style="margin-bottom:10px">FLOW</div><svg id="flow" viewBox="0 0 1020 120" width="100%"></svg></div>
<div style="background:#111113;border:1px solid #1f1f22;border-radius:16px;padding:24px;margin-top:16px"><div class="t" style="font-size:20px">Pre-demo checklist</div>
<label><input type="checkbox">Open the demo URL in Chrome; mic permission granted</label><label><input type="checkbox">Partner tabs logged in: Daytona, Surrealist, Arize, ElevenLabs</label><label><input type="checkbox">/dashboard Arize card shows Connected</label><label><input type="checkbox">Use a cached chip question (no new model call); sound on</label><label><input type="checkbox">Backup video ready: /static/backup_demo.mp4</label></div>
<div id="steps"></div></div>
<script>
const A="https://app.arize.com/organizations/QWNjb3VudE9yZ2FuaXphdGlvbjo1MjM0Mjo2cVRj/spaces/U3BhY2U6NTY4Nzk6MHhDRQ==";
const S=[["Problem",20,"Multi-agent AI is unreliable in production: agents collide and duplicate work, act on unverified output, touch real systems unsafely, and leave no trace."],
["Precedent",20,"Our pipeline fixes each problem, and each fix is a partner: isolation (Daytona), grounded memory (SurrealDB + Octo), observability and evals (Arize), voice (ElevenLabs), coordination (ACS), verification (safeguard), guardrails (Anthropic fallback and caps). First use case: verified legal research memos for professionals."],
["Live demo",60,"Click the mic → ask <b>“Automobile exception: probable cause standard in Colorado”</b> (cached) → point at the live agent feed → map lights up by county and court → hover a case → click <b>Listen</b>. <a class='btn' style='margin-left:8px' href='/' target='_blank'>Open demo ↗</a>"],
["Partners",60,"__P__"],["Safeguards",20,"No unretrieved citation survives; quotes are verbatim; rate limits and hourly caps; a ‘not legal advice’ disclaimer."],
["Close",20,"Go to slide 7 (one partners slide), then slide 8: Thank you / Open live demo. “A reliable pipeline for multi-agent AI, built with Daytona, SurrealDB, Octo, Arize, ElevenLabs, ACS and Anthropic.” <a class='btn' style='margin-left:8px' href='/slides' target='_blank'>Open slides ↗</a>"]];
const PL=[["daytona","The whole stack (agents, SurrealDB, CI) runs in one isolated sandbox.","https://app.daytona.io"],["surrealdb","A citation graph of 120k authorities and 161k edges expands what's retrieved.","https://surrealist.app"],
["arize","OpenInference traces per agent plus citation_guard and groundedness evals.",A+"/home"],["elevenlabs","Reads the short answer aloud; hands-free voice loop.","https://elevenlabs.io/app"],["acs","Agent seats, handoffs and an audit record for every run.","/dashboard#acs"]];
const ph=PL.map(([k,t,u])=>"<div class='p'><span style='width:230px;flex:none'>"+partnerMark(k,26)+"</span><span>"+t+"</span><a class='btn' target='_blank' rel='noopener' href='"+u+"'>Open dashboard ↗</a></div>").join("");
document.getElementById("steps").innerHTML=S.map(([t,sec,d],i)=>"<div class='step'><div class='n'>"+(i+1)+"</div><div><div class='t'>"+t+"</div><div style='margin-top:6px;color:#c4c4c8'>"+(d=="__P__"?ph:d)+"</div></div><div class='tm' data-s='"+sec+"'>"+Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")+"</div></div>").join("");
document.querySelectorAll(".tm").forEach(el=>el.onclick=()=>{ if(el._t){clearInterval(el._t);el._t=null;el.classList.remove("run");return;} let r=+el.dataset.s; el.classList.add("run"); el.classList.remove("over");
 el._t=setInterval(()=>{ r--; const a=Math.abs(r); el.textContent=(r<0?"-":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0"); if(r<0) el.classList.add("over"); },1000); });
const N=[["Query","#ededed"],["Octo","#f59e0b"],["SurrealDB","#ff00a0"],["Haiku memo","#d97757"],["Safeguard","#ededed"],["ElevenLabs","#f5f5f4"]];
let g="";N.forEach(([n,c],i)=>{const x=10+i*170;g+="<rect x='"+x+"' y='20' width='140' height='48' rx='10' fill='#18181b' stroke='"+c+"'/><text x='"+(x+70)+"' y='50' fill='"+c+"' font-size='15' font-weight='600' text-anchor='middle'>"+n+"</text>"+(i?"<path d='M"+(x-28)+" 44 H"+(x-4)+"' stroke='#555' stroke-width='2'/><path d='M"+(x-10)+" 38 L"+(x-3)+" 44 L"+(x-10)+" 50' fill='none' stroke='#555' stroke-width='2'/>":"");});
g+="<text x='10' y='105' fill='#22d3a6' font-size='13'>all inside Daytona · ACS logs every handoff · Arize traces every span</text>";document.getElementById("flow").innerHTML=g;
</script></body></html>
