<!doctype html><html><head><meta charset="utf-8"><title>Precedent · A reliable pipeline for multi-agent AI</title><script src="/static/vendor/tailwind.js"></script><script src="/static/vendor/logos.js"></script><script src="/static/partners.js"></script>
<style>body{background:radial-gradient(1400px 700px at 10% -10%,#1e1b4b 0,#0b1020 55%,#05070f 100%);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.slide{display:none}.slide.on{display:flex}
.shot{border-radius:14px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.5)}.n{font-variant-numeric:tabular-nums}
.edge{stroke:#6366f1;stroke-width:3;fill:none;stroke-dasharray:10 8;animation:f 1s linear infinite}@keyframes f{to{stroke-dashoffset:-18}}</style></head>
<body class="text-slate-100 overflow-hidden">
<nav class="fixed top-0 inset-x-0 z-40 backdrop-blur bg-slate-950/60 border-b border-white/5"><div class="max-w-7xl mx-auto px-6 h-11 flex items-center gap-6 text-sm"><span class="font-bold text-indigo-400">⚖ Precedent</span><a href="/" class="text-slate-300 hover:text-white">Demo</a><a href="/map" class="text-slate-300 hover:text-white">Map</a><a href="/dashboard" class="text-slate-300 hover:text-white">Dashboards</a><a href="/slides" class="text-slate-300 hover:text-white">Slides</a><a href="/guide" class="text-slate-300 hover:text-white">Guide</a></div></nav>
<main id="deck"></main>
<div class="fixed bottom-5 right-6 flex gap-3 items-center text-sm z-50"><span id="pg" class="text-slate-500 n"></span><button id="vo" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20">🎙 Voiceover</button></div>
<script>
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const big=(v,l,c="text-indigo-300")=>`<div><div class="text-5xl font-bold n ${c}">${esc(v)}</div><div class="text-sm text-slate-400 mt-1">${l}</div></div>`;
const S=(kicker,title,body)=>`<section class="slide min-h-screen flex-col justify-center px-20 pt-14"><div class="text-sm uppercase tracking-[.3em] text-indigo-400 mb-3">${kicker}</div><h1 class="text-6xl font-bold mb-8 tracking-tight">${title}</h1>${body}</section>`;
const CAP={"dash_Daytona.png":"Live sandbox: 96 vCPUs, uptime, pipeline latency per run","dash_SurrealDB.png":"A run's subgraph: retrieved authorities and citation edges, mapped by county and court","dash_Arize.png":"Arize connected: OpenInference spans and citation_guard/groundedness evals, with deep links","dash_ElevenLabs.png":"Voice usage against hourly caps; clips cached by text hash","dash_ACS.png":"ACS audit records, events and safeguard pass rate across recent runs","map_sidebar.png":"Cases grouped by county; cited [n] vs related"};
const img=(f,cls="")=>`<figure class="${cls}"><img src="/static/slides/${f}?v=2" class="shot w-full" onerror="this.style.display='none'">${CAP[f]?`<figcaption class="text-base text-slate-400 mt-3">${CAP[f]}</figcaption>`:""}</figure>`;
const wall=()=>`<div class="flex flex-wrap items-center gap-x-16 gap-y-8 mt-12">${["daytona","surrealdb","arize","elevenlabs"].map(k=>partnerMark(k,72)).join("")}</div><div class="flex flex-wrap items-center gap-x-12 gap-y-6 mt-8 opacity-90">${["anthropic","octo","acs"].map(k=>partnerMark(k,48)).join("")}</div>`;
const two=(a,b)=>`<div class="grid grid-cols-2 gap-6 mt-8 max-w-6xl"><div class="rounded-2xl p-5 bg-white/5 border border-white/10"><div class="text-sm uppercase tracking-widest text-slate-400 mb-1">How it made this possible</div><div class="text-xl">${a}</div></div><div class="rounded-2xl p-5 bg-emerald-500/10 border border-emerald-400/30"><div class="text-sm uppercase tracking-widest text-emerald-300 mb-1">How it made us faster</div><div class="text-xl">${b}</div></div></div>`;
const P=(k,fix,body,a,b)=>`<section class="slide min-h-screen flex-col justify-center px-20 pt-14"><div class="text-sm uppercase tracking-[.3em] text-slate-400 mb-3">Fix: ${fix}</div><div class="mb-6">${partnerMark(k,96)}</div>${body}${two(a,b)}</section>`;
async function build(){let d={};try{d=await (await fetch("/api/stack")).json()}catch(e){}
 const D=d.daytona||{},SU=d.surrealdb||{},O=d.octo||{},M=d.model||{},E=d.elevenlabs||{},A=d.acs||{},Z=d.arize||{},L=(d.limits||{caps:{}}),C=L.caps||{};
 const runs=d.runs||[],pass=runs.filter(r=>r.pass).length, AZ="https://app.arize.com/organizations/QWNjb3VudE9yZ2FuaXphdGlvbjo1MjM0Mjo2cVRj/spaces/U3BhY2U6NTY4Nzk6MHhDRQ==";
 const node=(x,y,w,t,s,c)=>`<g><rect x="${x}" y="${y}" width="${w}" height="74" rx="14" fill="#0f172a" stroke="${c}" stroke-width="2.5"/><text x="${x+w/2}" y="${y+32}" fill="${c}" font-size="22" font-weight="800" text-anchor="middle">${t}</text><text x="${x+w/2}" y="${y+56}" fill="#94a3b8" font-size="14" text-anchor="middle">${s}</text></g>`;
 const row=(i,t,p)=>`<div class="flex items-baseline gap-6 py-3 border-b border-white/10"><span class="text-2xl text-slate-400 w-[520px]">${i}</span><span class="text-3xl font-bold">${t}</span><span class="ml-auto text-2xl">${p}</span></div>`;
 const slides=[
 S("The problem","Multi-agent AI is unreliable in production",`<div class="grid grid-cols-2 gap-6 text-2xl max-w-6xl">${[["💥","Agents collide and duplicate work"],["❓","They act on unverified output"],["⚠️","They touch real systems unsafely"],["🕳","Nobody can trace what happened"]].map(([e,t])=>`<div class="rounded-2xl p-6 bg-white/5 border border-white/10">${e} ${t}</div>`).join("")}</div><div class="text-2xl text-slate-300 mt-10 max-w-5xl">Precedent is a pipeline that fixes each of these. First high-stakes use case: <b>verified research memos for legal professionals</b>. The same pipeline works for other domains.</div>`),
 S("Our pipeline","Every fix is a partner",`<div class="max-w-6xl">${row("Isolation: sandboxed agents, safe real-tool use",partnerMark("daytona",34),"")}${row("Grounded memory: knowledge graph + passages",partnerMark("surrealdb",34),partnerMark("octo",28))}${row("Observability + evals",partnerMark("arize",34),"")}${row("Voice interface",partnerMark("elevenlabs",34),"")}${row("Coordination: claim file, audit log, teammates' agents",partnerMark("acs",34),"")}${row("Verification: safeguard agent","Safeguard","")}${row("Guardrails: rate limits, cost caps, model fallback",partnerMark("anthropic",34),"")}</div>`),
 S("Architecture","One query through the pipeline",`<svg viewBox="0 0 1240 330" class="w-full max-w-6xl">
  <path class="edge" d="M150,165 H200"/><path class="edge" d="M360,165 C390,165 390,80 420,80"/><path class="edge" d="M360,165 C390,165 390,250 420,250"/><path class="edge" d="M600,80 C630,80 630,165 660,165"/><path class="edge" d="M600,250 C630,250 630,165 660,165"/><path class="edge" d="M840,165 H870"/><path class="edge" d="M1030,165 H1060"/>
  ${node(10,128,140,"Query","voice or text","#e2e8f0")}${node(200,128,160,"ACS","planner claims seats","#38bdf8")}${node(420,43,180,"Octo","passages","#f59e0b")}${node(420,213,180,"SurrealDB","graph expansion","#ff00a0")}
  ${node(660,128,180,"Anthropic","Haiku memo","#d97757")}${node(870,128,160,"Safeguard","verify citations","#34d399")}${node(1060,128,170,"ElevenLabs","read aloud","#f5f5f4")}
  <rect x="190" y="18" width="860" height="290" rx="24" fill="none" stroke="#22d3a6" stroke-dasharray="6 6" opacity=".7"/><text x="210" y="300" fill="#22d3a6" font-size="18" font-weight="700">DAYTONA SANDBOX</text><text x="1040" y="300" fill="#a78bfa" font-size="18" font-weight="700" text-anchor="end">ARIZE: a span + evals for every step</text></svg>`),
 S("Live demo","Query → live agents → map → verified memo",`<div class="grid grid-cols-5 gap-6 items-start">${img("dash_SurrealDB.png","col-span-3 w-full")}<div class="col-span-2 space-y-4">${img("map_sidebar.png","w-full")}<div class="text-xl text-slate-300">Authorities mapped by county and court; every citation verified; Listen reads the short answer.</div></div></div>`),
 P("daytona","Isolation",`<div class="grid grid-cols-5 gap-8 items-center">${img("dash_Daytona.png","col-span-3 w-full")}<div class="col-span-2 grid grid-cols-2 gap-8">${big(D.cpus||"-","vCPUs","text-emerald-300")}${big((D.ram_gb||"-")+" GB","RAM","text-emerald-300")}${big(D.uptime_h||"-","hours uptime","text-emerald-300")}${big("1","sandbox for everything","text-emerald-300")}</div></div>`,
  "Agents, SurrealDB, CI and the web app run inside one isolated sandbox, so agents can use real tools without touching our machines.","We got a ready "+(D.cpus||96)+"-CPU sandbox in minutes, with zero infra work and a public preview URL for free."),
 P("surrealdb","Grounded memory",`<div class="grid grid-cols-5 gap-8 items-center">${img("dash_SurrealDB.png","col-span-3 w-full")}<div class="col-span-2 grid grid-cols-2 gap-8">${big((SU.nodes||119770).toLocaleString(),"authorities","text-pink-300")}${big((SU.edges||160793).toLocaleString(),"citation edges","text-pink-300")}${big((SU.avg_ms||"-")+" ms","avg graph query","text-pink-300")}${big("804k","Octo passages","text-amber-300")}</div></div>`,
  "Retrieved passages from Octo are expanded through a citation graph (RELATE edges), so memos rest on authorities that cite each other.","The "+(SU.nodes||119770).toLocaleString()+"-node graph loads in 23.6 s, and graph expansion is a single query."),
 P("arize","Observability + evals",`<div class="grid grid-cols-5 gap-8 items-center">${img("dash_Arize.png","col-span-3 w-full")}<div class="col-span-2 space-y-4"><div class="text-xl text-slate-300">OpenInference spans: RETRIEVER (documents), LLM (messages, tokens), GUARDRAIL. Span evals: <b>citation_guard</b> and <b>groundedness</b>. Project precedent-legal-graphrag.</div><div class="text-lg ${Z.connected?"text-emerald-300":"text-amber-300"}">${esc(Z.status||"")}</div><div class="flex flex-wrap gap-3">${["Home","Evaluators","Datasets","Experiments","Monitors"].map(x=>`<a target="_blank" rel="noopener" href="${AZ}/${x.toLowerCase()}" class="px-4 py-2 rounded-full border border-violet-400/50 text-violet-300 hover:bg-violet-500/20">${x} ↗</a>`).join("")}</div></div></div>`,
  "Every agent step is a trace you can inspect, with evals attached, so a failed answer can be traced to the exact retrieval or draft.","We got tracing and evals without building our own: register() plus span attributes, live in under 30 minutes."),
 P("elevenlabs","Voice interface",`<div class="grid grid-cols-5 gap-8 items-center">${img("dash_ElevenLabs.png","col-span-3 w-full")}<div class="col-span-2 grid grid-cols-2 gap-8">${big(E.cached_files??0,"cached clips")}${big((C.elevenlabs_tts||{}).cap_per_hour||30,"TTS cap / hour")}</div></div>`,
  "Hands-free loop: speak a query, agents run, and the short answer is read back (eleven_flash_v2_5, scribe_v1 for speech-to-text).","Voice in and out each took one API call, with no audio pipeline to build."),
 P("acs","Coordination",`<div class="grid grid-cols-5 gap-8 items-center">${img("dash_ACS.png","col-span-3 w-full")}<div class="col-span-2 grid grid-cols-2 gap-8">${big(A.issue_logs??"-","audit records","text-sky-300")}${big(A.events??"-","agent events","text-sky-300")}${big(A.tasks??"-","claimable tasks","text-sky-300")}${big(pass+"/"+runs.length,"runs passed safeguard","text-emerald-300")}</div></div>`,
  "A claim file gives one owner per task; every handoff and run is a schema-valid audit record, and teammates' agents can claim tasks remotely.","Parallel agents and teammates worked without collisions. Claim, branch, merge."),
 S("Verification + guardrails","Safe by construction",`<div class="grid grid-cols-2 gap-6 text-xl max-w-6xl">${[["🛡 Safeguard agent","Every cited authority must be in the retrieved set; quotes verbatim; otherwise FAIL."],["⏱ Rate limits","1 run in flight · 6 q/min/IP · hourly caps: Haiku "+((C.anthropic||{}).cap_per_hour||40)+", TTS "+((C.elevenlabs_tts||{}).cap_per_hour||30)+", STT "+((C.elevenlabs_stt||{}).cap_per_hour||20)],["↘ Model fallback","Anthropic Haiku → labeled template; ElevenLabs → browser voice; Octo live → snapshot."],["💸 Cost","Prompt-hash cache: "+(M.real_calls?M.real_calls.anthropic:"-")+" Haiku calls across "+(M.runs||"-")+" runs."],["🔑 Secrets","Keys only in a mode-600 env file; never printed, never committed."],["⚖ Not legal advice","A caveat on every memo; the attorney verifies."]].map(([t,b])=>`<div class="rounded-2xl p-5 bg-white/5 border border-white/10"><div class="font-semibold mb-1">${t}</div><div class="text-slate-300 text-lg">${b}</div></div>`).join("")}</div>`),
 S("Thank you to our partners","A reliable pipeline for multi-agent AI",`${wall()}<a href="/" class="inline-block text-2xl px-8 py-4 mt-12 rounded-2xl bg-indigo-500 hover:bg-indigo-400 font-semibold w-max">Open live demo ↗</a>`)];
 document.getElementById("deck").innerHTML=slides.join("");go(0)}
let i=0;function go(k){const S=[...document.querySelectorAll(".slide")];i=Math.max(0,Math.min(S.length-1,k));S.forEach((s,j)=>s.classList.toggle("on",j===i));document.getElementById("pg").textContent=`${i+1} / ${S.length}`}
addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown"].includes(e.key))go(i+1);if(["ArrowLeft","PageUp"].includes(e.key))go(i-1)});
addEventListener("click",e=>{if(e.target.closest("a,button,nav"))return;go(i+(e.clientX>innerWidth/3?1:-1))});
let vo=null;document.getElementById("vo").onclick=e=>{e.stopPropagation();if(vo&&!vo.paused){vo.pause();return}vo=vo||new Audio("/static/voiceover.mp3");vo.play()};
build();
</script></body></html>
