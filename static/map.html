<script>
const $=id=>document.getElementById(id), esc=t=>String(t||"").replace(/[<&]/g,m=>m=="<"?"&lt;":"&amp;");
let cur=null;
function side(r){ const c=(window.Docs3D&&Docs3D._c)||r.citations; const g={};
 c.forEach((x,i)=>{ const L=x._loc||{}; const k=L.cat==="county"?L.key.replace(/\b\w/g,m=>m.toUpperCase())+" County":(L.label||"Other"); (g[k]=g[k]||[]).push(i); });
 const ks=Object.keys(g).sort((a,b)=>g[b].length-g[a].length); const nc=ks.filter(k=>k.endsWith(" County")).length;
 $("stat").textContent=`${nc} counties linked · ${ks.length} locations · ${c.length} documents`; $("st2").textContent=(r.question||"")+(r.provider?" · "+r.provider:"");
 $("side").innerHTML=ks.map(k=>`<div><div class="flex justify-between text-xs uppercase tracking-wider text-slate-400"><span>${esc(k)}</span><span class="text-emerald-300">${g[k].length}</span></div>`+
  g[k].map(i=>{const x=c[i],rel=!x.ref;return `<div class="mt-1 rounded-lg p-2 hover:bg-slate-800 cursor-pointer ${rel?"opacity-60":"bg-slate-900/60"}" onclick="(Docs3D.jump||Docs3D.focus)(${i});Docs3D.open(Docs3D._c[${i}])"><span class="${rel?"text-slate-500 text-[11px] uppercase tracking-wider":"text-indigo-300 font-bold"}">${rel?"related":esc(x.ref)}</span> ${esc(x.title)}<div class="text-[11px] text-slate-500">${[x.court,(x.date||"").slice(0,4)].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div></div>`}).join("")+`</div>`).join(""); }
function summaryOf(a){ a=String(a||""); const L=a.split("\n"); let i=L.findIndex(l=>/short answer|bottom line/i.test(l)); let txt="";
 if(i>=0){ txt=L[i].replace(/^[#*\s-]*(short answer|bottom line)[:*\s-]*/i,""); for(let k=i+1;k<L.length&&txt.length<380;k++){ if(/^\s*(#|\*\*[A-Z])/.test(L[k])&&txt) break; txt+=" "+L[k]; } }
 if(!txt.trim()) txt=a.replace(/^#.*$/mg,"");
 txt=txt.replace(/\*\*|[*#>`_]/g,"").replace(/\s+/g," ").trim();
 const S=txt.match(/[^.!?]+[.!?]+/g)||[txt]; return S.slice(0,3).join(" ").trim().slice(0,520); }
function renderSum(r){ const sg=r.safeguard||{}; const used=(sg.used||[]).length; const ok=sg.pass;
 const badge=r.answer?`<span class="inline-block mt-2 rounded-full px-2 py-0.5 text-xs ${ok?"bg-emerald-500/15 text-emerald-300 border border-emerald-500/40":"bg-amber-500/15 text-amber-300 border border-amber-500/40"}">${ok?"🛡 "+used+" references matched retrieved sources":"⚠ citation check flagged issues"}</span> <span class="text-[11px] text-slate-500">checks references, not legal accuracy</span>`:"";
 $("sum").innerHTML=`<div class="text-xs text-slate-400 mb-1">${esc(r.question||"")}</div>`+(r.answer?esc(summaryOf(r.answer)).replace(/\[(\d+)\]/g,'<button type="button" class="sref text-indigo-300 hover:underline" onclick="Docs3D.jumpRef&&Docs3D.jumpRef($1)">[$1]</button>'):`<span class="text-slate-400">Agents drafting the memo…</span>`)+"<br>"+badge; window._sumText=r.answer?summaryOf(r.answer).replace(/\s*\[\d+\]/g,""):""; $("sumbox").open=true; }
/* Tour voice waits for the answer summary: until it has been spoken (or skipped), tour stops only show captions, so stop 1 is never heard twice. */
let sumTok=0; function awaitSum(){ sumTok++; if(window.Docs3D) Docs3D.awaitSummary=sumTok; }
function speakSummary(){ const k=sumTok; return speakSummary0().finally(()=>{ if(window.Docs3D&&Docs3D.awaitSummary===k) Docs3D.awaitSummary=0; }); }
function speakSummary0(){ const t=window._sumText; try{ t&&window.Docs3D&&Docs3D.summaryStop&&Docs3D.summaryStop(t); }catch(e){} if(!t||(window.AudioMgr&&AudioMgr.isMuted())||!(window.Docs3D&&Docs3D.voice)) return Promise.resolve(); if(AudioMgr.say){ const p=AudioMgr.say(t, document.getElementById('sumplay'), {queue:true}); try{ Docs3D.prefetch&&Docs3D.prefetch(Docs3D.order()[0]); }catch(e){} return p; }   /* tour's first line downloads while the summary plays */
 return fetch("/api/tts_ts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t.slice(0,400)})}).then(r=>r.ok&&r.status!==204?r.json():null).then(j=>{ if(!j||!j.audio_b64) return; const b=atob(j.audio_b64),u=new Uint8Array(b.length); for(let k=0;k<b.length;k++) u[k]=b.charCodeAt(k); const a=new Audio(URL.createObjectURL(new Blob([u],{type:"audio/mpeg"}))); return new Promise(res=>{ a.onended=res; a.onerror=res; a.play().catch(res); }); }).catch(()=>{}); }
function show(r){ renderSum(r); cur=r; const go=()=>{ if(!window.Docs3D||!Docs3D.view){ return setTimeout(go,200);} Docs3D.ctx={answer:r.answer||"",question:r.question||""}; if(r.answer&&!show.noTour){ Docs3D.holdUntil=Date.now()+4000; awaitSum(); } Docs3D.show(r.citations||[],r.edges||[],r.documents||[]); if(r.answer&&Docs3D.prefetchTour) Docs3D.prefetchTour(window._runId||"",window._sumText||""); side(r); if(r.answer&&!show.noTour){ clearTimeout(show._t); show._t=setTimeout(()=>{ if(window.Docs3D&&Docs3D.tour) (g=>speakSummary().then(()=>{ if((AudioMgr.gen||0)===g) Docs3D.tour(0); }))(AudioMgr.gen||0); },1200); } }; go(); }
async function load(id){ window._runId=id; const d=await (await fetch("/api/run/"+id)).json(); if(d.result) show(d.result); }
async function runs(sel){ const L=await (await fetch("/api/runs")).json(); $("runs").innerHTML=L.map(x=>`<option value="${x.run_id}">${esc(x.run_id)} · ${esc((x.question||"").slice(0,40))} (${x.n})</option>`).join(""); if(sel) $("runs").value=sel; if(L.length) load(sel||L[0].run_id); else if(sel) load(sel); else featured(); }
/* Brand-new session (no runs yet): show a known-good cached demo run so the map isn't empty. Not added to the session's runs. */
async function featured(){ try{ const r=await (await fetch("/static/featured-run.json?v=fr1")).json(); if(!r||!r.citations||$("runs").options.length) return;
  $("runs").innerHTML=`<option value="" selected>★ Featured demo · ${esc((r.question||"").slice(0,40))}</option>`; window._runId=r.run_id||""; show(r); }catch(e){} }
$("runs").onchange=e=>load(e.target.value);
document.querySelectorAll(".v").forEach(b=>b.onclick=()=>window.Docs3D&&Docs3D.view&&Docs3D.view(b.dataset.v));
$("f").onsubmit=async e=>{ e.preventDefault(); const q=$("q").value.trim(); if(!q) return; window.AudioMgr&&AudioMgr.stopAll(); window.Docs3D&&Docs3D.stopTour&&Docs3D.stopTour(); awaitSum(); if(window.Docs3D) Docs3D.voice=!(window.AudioMgr&&AudioMgr.isMuted()); clearTimeout(show._t); { const T=document.getElementById("transcript"); if(T){ T.classList.add("hidden"); T.innerHTML=""; } } window.Docs3D&&Docs3D.busy(); window._sumText=""; $("sum").innerHTML='<div class="text-xs text-slate-400 mb-1">'+esc(q)+'</div><span class="text-slate-400">Working…</span>'; $("stat").textContent="Agents working…";
 const resp=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(window.FOLLOW?FOLLOW.body(q):{question:q})}); const j=await resp.json().catch(()=>({}));
 if(!resp.ok){ if(window.Docs3D) Docs3D.awaitSummary=0; $("stat").textContent="⏳ "+(j.error||"busy"); return; }
 let early=false; const poll=async()=>{ const d0=await (await fetch("/api/run/"+j.run_id)).json(); const d=window.AgentNodes?AgentNodes.gate(j.run_id,d0):d0; const rk=(d.events||[]).find(e=>e.kind=="ranked"&&e.citations); if(rk&&!early){ early=true; show({citations:rk.citations,edges:rk.edges||[],documents:[],question:q,provider:"answer drafting…"}); } if(d.result){ window._runId=j.run_id; window.FOLLOW&&FOLLOW.onResult(Object.assign({run_id:j.run_id,question:q},d.result)); if(!early) runs(j.run_id); else { $("st2").textContent=q+" · "+(d.result.provider||""); runs.keep=j.run_id; refreshRuns(j.run_id); if(window.Docs3D) Docs3D.ctx={answer:d.result.answer||"",question:q}; renderSum(Object.assign({question:q},d.result)); window._runId=j.run_id; if(window.Docs3D&&Docs3D.prefetchTour) Docs3D.prefetchTour(j.run_id,window._sumText||""); if(!askWait&&window.Docs3D&&Docs3D.tour) (g=>speakSummary().then(()=>{ if((AudioMgr.gen||0)===g) Docs3D.tour(0); }))(AudioMgr.gen||0); if(askWait){ const f=askWait; askWait=null; f(d.result); } } } else setTimeout(poll,300); }; poll(); };
async function refreshRuns(sel){ const L=await (await fetch("/api/runs")).json(); $("runs").innerHTML=L.map(x=>`<option value="${x.run_id}">${esc(x.run_id)} · ${esc((x.question||"").slice(0,40))} (${x.n})</option>`).join(""); $("runs").value=sel; }
const qs=new URLSearchParams(location.search); runs(qs.get("run"));
let askWait=null; const _show=show; show=function(r){ _show(r); if(askWait&&r.answer!==undefined&&r.provider&&!/drafting/.test(r.provider)){ const f=askWait; askWait=null; f(r); } };
window.PRECEDENT={ ask:t=>new Promise(res=>{ askWait=res; $("q").value=t; $("f").requestSubmit(); setTimeout(()=>{ if(askWait===res){ askWait=null; res(null);} },60000); }),
  speak:()=>new Promise(res=>{ if(!window.Docs3D) return res(); clearTimeout(show._t); Docs3D.voice=!(window.AudioMgr&&AudioMgr.isMuted()); Docs3D._done=res; (g=>speakSummary().then(()=>{ if((AudioMgr.gen||0)===g) Docs3D.tour(0); }))(AudioMgr.gen||0); }) };
$("sumplay").onclick=e=>{ e.preventDefault(); e.stopPropagation(); const b=$("sumplay"); if(AudioMgr.playing()||b.dataset.loading==="1"){ AudioMgr.stopAll(); b.dataset.loading="0"; b.dataset.owner="0"; return; } if(window.Docs3D) Docs3D.stopTour(); if(AudioMgr.isMuted()) AudioMgr.setMuted(false); AudioMgr.say(window._sumText||"",b); };
</script>
