name: redteam
# Scope: features, UX, flows, intuitiveness, fallbacks ONLY. Do not file security issues.
on:
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: redteam-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redteam:
    name: redteam
# Scope: features, UX, flows, intuitiveness, fallbacks ONLY. Do not file security issues.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LLM_MODE: fake
      ACS_HOTLOAD: "0"
      REDTEAM: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-json-report playwright
          python -m playwright install --with-deps chromium
      - name: Run red-team suite (fallback/integrity/UX only; no security)
        id: pytest
        continue-on-error: true
        run: |
          pytest -q -p no:cacheprovider tests/redteam \
            --json-report --json-report-file=redteam-report.json -rs || true
          # pytest-json-report may be absent; fall back to junit + minimal converter
          if [ ! -f redteam-report.json ]; then
            pip install pytest-json-report
            pytest -q -p no:cacheprovider tests/redteam \
              --json-report --json-report-file=redteam-report.json -rs || true
          fi
          test -f redteam-report.json
      - name: Playwright UX click-every-control and flows (live BASE_URL or skip)
        if: always()
        env:
          REDTEAM_BASE_URL: ${{ vars.REDTEAM_BASE_URL || 'https://arize.design-bakery.com' }}
          REDTEAM_LIVE: "1"
        continue-on-error: true
        run: |
          pytest -q -p no:cacheprovider tests/redteam/test_ux_playwright.py             --json-report --json-report-file=redteam-ux-report.json -rs || true
          if [ -f redteam-ux-report.json ]; then
            python .github/scripts/redteam_report_issues.py redteam-ux-report.json
          fi
      - name: Open or update OIO issues for failures
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/redteam_report_issues.py redteam-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: redteam-report.json
