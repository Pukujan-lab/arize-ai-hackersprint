name: redteam
on:
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: redteam-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redteam:
    name: redteam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_MODE: fake
      ACS_HOTLOAD: "0"
      REDTEAM: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-json-report
      - name: Run red-team suite (local TestClient only; no live flood)
        id: pytest
        continue-on-error: true
        run: |
          pytest -q -p no:cacheprovider tests/redteam \
            --json-report --json-report-file=redteam-report.json -rs || true
          # pytest-json-report may be absent; fall back to junit + minimal converter
          if [ ! -f redteam-report.json ]; then
            pip install pytest-json-report
            pytest -q -p no:cacheprovider tests/redteam \
              --json-report --json-report-file=redteam-report.json -rs || true
          fi
          test -f redteam-report.json
      - name: Open or update OIO issues for failures
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/redteam_report_issues.py redteam-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: redteam-report.json
