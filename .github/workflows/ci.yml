name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_MODE: fake
      ACS_HOTLOAD: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff mypy
      - name: Lint (ruff check)
        run: ruff check --output-format=github .
      - name: Format (ruff format --check)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy server.py app acs/board.py acs/claim.py acs/hotload.py
      - name: Compile
        run: python -m compileall -q -x '(\.venv|node_modules)' .
      - name: Tests (no secrets, no data, no network)
        run: pytest -q -p no:cacheprovider tests -rs
