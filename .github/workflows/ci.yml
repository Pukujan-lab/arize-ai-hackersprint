name: CI
on:
  pull_request:
    # edited/labeled rerun the PR-body check (tools/pr_policy.py) when the body or labels change
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_MODE: fake
      ACS_HOTLOAD: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned writing helper (CGM 0.5.12, see docs/continuity/cgm-pin.md)
        uses: actions/checkout@v4
        with:
          repository: Pukujan/content-generation-modules
          ref: 6831f91e165b62d719c05eb492f7375fa932b560
          path: .cgm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Reuse before you write (PR body names the OSS considered, or is a confirmed bugfix; see AGENTS.md)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/pr_policy.py --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff mypy uv==0.13.1 pip-audit pip-licenses
      - name: Lock matches requirements.in (uv pip compile, diff)
        run: |
          cp requirements.txt /tmp/lock.txt
          uv pip compile requirements.in --universal --python-version 3.9 -q \
            --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.9 -o requirements.txt" -o /tmp/lock.txt
          diff -u requirements.txt /tmp/lock.txt || { echo "::error::requirements.txt is out of date; run the uv pip compile command at its top"; exit 1; }
      - name: Dependency licenses (pip-licenses against the allowlist)
        run: python tools/dep_policy.py licenses
      - name: Dependency vulnerabilities (pip-audit on the pins CI installs; strict when the PR changes requirements)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          python tools/dep_policy.py pins > /tmp/pins.txt
          strict=0
          if [ -n "$BASE" ]; then
            git fetch --quiet --depth=1 origin "$BASE"
            git diff --name-only "origin/$BASE" HEAD | grep -qE '^requirements\.(in|txt)$' && strict=1
          fi
          if ! pip-audit -r /tmp/pins.txt --no-deps --disable-pip --progress-spinner off; then
            [ "$strict" = 1 ] && { echo "::error::this PR changes the requirements and a pinned package has a known vulnerability"; exit 1; }
            echo "::warning::pip-audit found known vulnerabilities in existing pins; a Dependabot PR or a lock refresh should fix them"
          fi
          # The Pro's Python 3.9 pins, reported only: newer fixes need Python 3.10+ (see #20).
          pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off >/tmp/audit-all.txt 2>&1 || echo "::warning::pip-audit reports known vulnerabilities in the Python 3.9 pins the Pro runs (see #20): $(grep -cE '^[a-z0-9-]+ +[0-9]' /tmp/audit-all.txt) findings"
      - name: New dependencies are maintained (PyPI release in the last 12 months)
        if: github.event_name == 'pull_request'
        run: python tools/dep_policy.py maturity --base "origin/${{ github.base_ref }}"
      - name: Dependency review with OpenSSF Scorecard (runs once the repo's dependency graph is on and vars.DEPENDENCY_REVIEW is 'on')
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'on'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, PSF-2.0, Python-2.0, MPL-2.0, Unlicense, 0BSD, Zlib, CC0-1.0
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3
      - name: Check out the pinned OIO (see docs/continuity/oio-pin.md)
        uses: actions/checkout@v4
        with:
          repository: Pukujan/observational-issue-ops
          ref: e5e5fb1250aa8d154e9a83554638aec4cc8b2c8a
          path: .oio-src
      - name: OIO adoption (pin, installer --check, AGENTS.md guidance)
        run: |
          python -m pip install -r .oio/requirements.txt
          python tools/validate_oio_adoption.py --helper-root .oio-src
      - name: CGM adoption (pin, AGENTS.md boot block, asset provenance)
        run: python tools/validate_cgm_adoption.py --helper-root .cgm
      - name: CGM adapter and README scope
        run: python .cgm/scripts/validate_content_system.py --root .cgm --adapter .content-system --project-root .
      - name: CGM always-on writing contract
        run: python .cgm/scripts/verify_hsw_applied.py --root .cgm
      - name: Lint (ruff check)
        run: ruff check --output-format=github .
      - name: Format (ruff format --check)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy server.py app acs/board.py acs/claim.py acs/hotload.py
      - name: Compile
        run: python -m compileall -q -x '(\.venv|node_modules|\.cgm)' .
      - name: Install Playwright Chromium so the browser tests gate
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Tests (no secrets, no data, no network)
        run: pytest -q -p no:cacheprovider tests -rs
