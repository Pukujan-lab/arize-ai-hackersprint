name: deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_reset_over_local:
        description: "Local changes on the Pro are verified merged (e.g. reformatted upstream): save a patch and reset anyway"
        type: boolean
        default: false
      force:
        description: "Redeploy even if already at origin/main"
        type: boolean
        default: false
  # Squash merges done by auto-merge (GITHUB_TOKEN) do not fire push/workflow_run events,
  # so also poll: deploy.sh is a no-op when ~/precedent is already at origin/main.
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: deploy-pro
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, precedent-pro]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to ~/precedent (health-checked, rolls back on failure)
        env:
          CONFIRM_RESET_OVER_LOCAL: ${{ inputs.confirm_reset_over_local || false }}
          FORCE_DEPLOY: ${{ inputs.force && '1' || '0' }}
        run: bash deploy/deploy.sh
