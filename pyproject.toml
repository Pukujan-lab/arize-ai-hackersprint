[tool.ruff]
target-version = "py39"
line-length = 160
extend-exclude = [".venv", "acs/seat_protocol.py", "acs/watchdog_check.py", "static", "arize", "docs"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
exclude = ["^acs/seat_protocol\\.py$", "^acs/watchdog_check\\.py$", "^tests/", "^tools/", "^arize/", "^ci/", "^docs/"]
